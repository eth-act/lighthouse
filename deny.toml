# cargo-deny configuration for Lighthouse
# See https://embarkstudios.github.io/cargo-deny/

[bans]
# Allow multiple versions by default. Change this to "warn" to see all multiple versions.
multiple-versions = "allow"
deny = [
    { crate = "ethers", reason = "legacy Ethereum crate, use alloy instead" },
    { crate = "ethereum-types", reason = "legacy Ethereum crate, use alloy-primitives instead" },
    { crate = "protobuf", reason = "use quick-protobuf instead" },
    { crate = "derivative", wrappers = ["ark-ff", "openvm-poseidon2-air", "openvm-stark-backend"], reason = "use educe or derive_more instead; ERE's pinned OpenVM verifier requires these wrappers" },
    { crate = "ark-ff", wrappers = ["zkhash-axiom"], reason = "only ERE's pinned OpenVM verifier requires this crate" },
    { crate = "openssl", reason = "non-Rust dependency, use rustls instead" },
    { crate = "c-kzg", reason = "non-Rust dependency, use rust_eth_kzg instead" },
    { crate = "serde_yaml", reason = "deprecated, use yaml_serde instead" },
    { crate = "strum", deny-multiple-versions = true, reason = "takes a long time to compile" },
    { crate = "reqwest", deny-multiple-versions = true, reason = "takes a long time to compile" },
    { crate = "aes", deny-multiple-versions = true, reason = "takes a long time to compile" },
    { crate = "sha2", deny-multiple-versions = true, reason = "takes a long time to compile" },
    { crate = "pbkdf2", deny-multiple-versions = true, reason = "takes a long time to compile" },
    { crate = "scrypt", deny-multiple-versions = true, reason = "takes a long time to compile" },
    { crate = "syn", deny-multiple-versions = true, reason = "takes a long time to compile" },
    { crate = "uuid", deny-multiple-versions = true, reason = "dependency hygiene" },
    { crate = "lru", deny-multiple-versions = true, reason = "use hashlink instead" },
]
skip = [
    { crate = "strum@0.26.3", reason = "required by ERE's pinned OpenVM verifier" },
    { crate = "syn@1.0.109", reason = "required by ERE's pinned OpenVM verifier" },
    { crate = "syn@3.0.5", reason = "required by ERE's pinned verifier dependencies" },
]

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[sources.allow-org]
github = ["sigp"]
