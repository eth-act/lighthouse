name: docker-buildx

on:
  push:
    branches:
      - optional-proofs
      - unstable
      - stable
    tags:
      - v*
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  prepare:
    name: prepare tags
    runs-on: ubuntu-22.04
    outputs:
      image: ${{ steps.tags.outputs.image }}
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${{ env.REGISTRY }}/${{ github.repository }}/lighthouse"
          REF="${GITHUB_REF}"
          REF_NAME="${GITHUB_REF_NAME}"
          SAFE_REF="${REF_NAME//\//-}"
          TAGS=()

          if [[ "$REF" == refs/tags/* ]]; then
            TAGS+=("${IMAGE}:${REF_NAME}")
          elif [[ "$REF" == refs/heads/stable ]]; then
            TAGS+=("${IMAGE}:latest")
          elif [[ "$REF" == refs/heads/unstable ]]; then
            TAGS+=("${IMAGE}:latest-unstable")
          elif [[ "$REF" == refs/heads/optional-proofs ]]; then
            TAGS+=("${IMAGE}:latest-optional-proofs")
            TAGS+=("${IMAGE}:latest")
          else
            TAGS+=("${IMAGE}:manual-${SAFE_REF}")
          fi

          {
            echo "image=${IMAGE}"
            echo "tags<<EOF"
            printf '%s\n' "${TAGS[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build-and-push:
    name: build and push lighthouse
    needs: prepare
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: |
            FEATURES=gnosis,spec-minimal,slasher-lmdb,jemalloc
            PROFILE=maxperf
          tags: ${{ needs.prepare.outputs.tags }}
          cache-from: type=gha,scope=docker-buildx-lighthouse
          cache-to: type=gha,mode=max,scope=docker-buildx-lighthouse
