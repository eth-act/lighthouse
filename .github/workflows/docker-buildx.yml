name: docker-buildx

on:
  push:
    branches:
      - optional-proofs
      - unstable
      - stable
    tags:
      - v*
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  CC: clang-5.0
  CXX: clang++-5.0

jobs:
  prepare:
    name: prepare tags
    runs-on: ubuntu-22.04
    outputs:
      image: ${{ steps.meta.outputs.image }}
      version: ${{ steps.meta.outputs.version }}
      version_suffix: ${{ steps.meta.outputs.version_suffix }}
      publish_latest: ${{ steps.meta.outputs.publish_latest }}
    steps:
      - name: Compute image tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${{ env.REGISTRY }}/${{ github.repository }}/lighthouse"
          REF="${GITHUB_REF}"
          REF_NAME="${GITHUB_REF_NAME}"
          SAFE_REF="${REF_NAME//\//-}"

          VERSION=""
          VERSION_SUFFIX=""
          PUBLISH_LATEST="false"

          if [[ "$REF" == refs/tags/* ]]; then
            VERSION="${REF_NAME}"
          elif [[ "$REF" == refs/heads/stable ]]; then
            VERSION="latest"
          elif [[ "$REF" == refs/heads/unstable ]]; then
            VERSION="latest"
            VERSION_SUFFIX="-unstable"
          elif [[ "$REF" == refs/heads/optional-proofs ]]; then
            VERSION="latest"
            VERSION_SUFFIX="-optional-proofs"
            PUBLISH_LATEST="true"
          else
            VERSION="manual-${SAFE_REF}"
          fi

          {
            echo "image=${IMAGE}"
            echo "version=${VERSION}"
            echo "version_suffix=${VERSION_SUFFIX}"
            echo "publish_latest=${PUBLISH_LATEST}"
          } >> "$GITHUB_OUTPUT"

  build-and-push-single-arch:
    name: build and push lighthouse-${{ matrix.short_arch }}
    needs: prepare
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            short_arch: amd64
          - target: aarch64-unknown-linux-gnu
            short_arch: arm64
    steps:
      - uses: actions/checkout@v5

      - name: Get latest version of stable Rust
        uses: moonrepo/setup-rust@v1
        with:
          channel: stable
          cache: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cross
        run: cargo install cross

      - name: Cross build lighthouse
        env:
          RUSTC_WRAPPER: ""
          CARGO_BUILD_RUSTC_WRAPPER: ""
          JEMALLOC_SYS_WITH_LG_PAGE: 16
        run: |
          cross build --bin lighthouse \
            --target ${{ matrix.target }} \
            --no-default-features \
            --features "portable,gnosis,spec-minimal,slasher-lmdb,jemalloc" \
            --profile maxperf \
            --locked

      - name: Prepare Docker context
        run: |
          mkdir -p bin
          cp ./target/${{ matrix.target }}/maxperf/lighthouse ./bin/lighthouse

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.cross
          platforms: linux/${{ matrix.short_arch }}
          push: true
          provenance: false
          tags: ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.version }}-${{ matrix.short_arch }}${{ needs.prepare.outputs.version_suffix }}

  create-manifest:
    name: create multi-arch manifest
    needs: [prepare, build-and-push-single-arch]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        shell: bash
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
          VERSION_SUFFIX: ${{ needs.prepare.outputs.version_suffix }}
          PUBLISH_LATEST: ${{ needs.prepare.outputs.publish_latest }}
        run: |
          set -euo pipefail

          SOURCE_AMD64="${IMAGE}:${VERSION}-amd64${VERSION_SUFFIX}"
          SOURCE_ARM64="${IMAGE}:${VERSION}-arm64${VERSION_SUFFIX}"

          TARGETS=("${IMAGE}:${VERSION}${VERSION_SUFFIX}")
          if [[ "${PUBLISH_LATEST}" == "true" ]]; then
            TARGETS+=("${IMAGE}:latest")
          fi

          for target in "${TARGETS[@]}"; do
            docker buildx imagetools create -t "${target}" \
              "${SOURCE_AMD64}" \
              "${SOURCE_ARM64}"
          done
