# Mixed configuration: 3 normal nodes with reth, 3 zkvm nodes with dummy_el
participants:
  # Normal nodes with real EL (nodes 1-3)
  - el_type: reth
    el_image: ghcr.io/paradigmxyz/reth:latest
    cl_type: lighthouse
    cl_image: lighthouse:local
    cl_extra_params:
      - --target-peers=5
    count: 3
  # ZKVM nodes with dummy EL (nodes 4-6)
  # Uses dummy_el wrapped as geth - returns SYNCING for all engine calls
  - el_type: geth
    el_image: dummy_el:local
    cl_type: lighthouse
    cl_image: lighthouse:local
    cl_extra_params:
      - --activate-zkvm
      - --target-peers=5
    count: 3
network_params:
  electra_fork_epoch: 0
  fulu_fork_epoch: 1
  seconds_per_slot: 2
global_log_level: debug
snooper_enabled: false
additional_services:
  - dora
  - prometheus_grafana
port_publisher:
  el:
    enabled: true
    public_port_start: 32000
  cl:
    enabled: true
    public_port_start: 33000